<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#092859">
  <title>Qvill — your space to think</title>
  <style>
    :root{--navy:#092859;--blue:#3d76c6;--paper:#f5f8fc;--ink:#263445;--muted:#77869a;--line:#e7ebf1;--green:#36836c}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f7f9fc;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{height:100vh;min-height:620px;display:flex;overflow:hidden}.sidebar{width:248px;flex-shrink:0;background:var(--navy);color:#fff;padding:23px 15px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 9px 25px}.mark{height:38px;width:38px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font:29px Georgia,serif;overflow:hidden}.mark img{width:100%;height:100%;object-fit:cover}.brand strong,.brand small,.account strong,.account small{display:block}.brand strong{font-size:16px}.brand small{font-size:10px;color:#b7c8df;margin-top:3px}.new{height:43px;border:0;border-radius:8px;background:#fff;color:var(--navy);font-weight:700;text-align:left;padding:0 12px;cursor:pointer}.new span{float:right;color:#8493a5;font-weight:400}.label{font-size:9px;letter-spacing:1.2px;color:#91a8c6;font-weight:700;padding:23px 9px 9px}.nav{height:38px;border:0;border-radius:7px;background:transparent;color:#d3deec;text-align:left;padding:0 11px;margin:2px 0;font-size:12px;cursor:pointer}.nav.active,.nav:hover{background:#ffffff18;color:white}.nav b{float:right;color:#91a8c6;font-size:10px;font-weight:500}.treehead{margin-top:17px;padding:18px 9px 8px;border-top:1px solid #ffffff20;color:#91a8c6;font-size:9px;letter-spacing:1.2px;font-weight:700}.treehead button{float:right;border:0;background:transparent;color:#b7c8df;font-size:16px;cursor:pointer}.tree{overflow:auto}.tree-row{height:31px;display:flex;align-items:center;border-radius:5px;padding-right:4px}.tree-row:hover,.tree-row.sel{background:#ffffff16}.tree-toggle{width:20px;border:0;background:transparent;color:#9db3cf;font-size:16px;cursor:pointer}.tree-level{font-size:8px;color:#92a6c2;margin-left:4px;margin-right:3px}.context-menu{position:fixed;z-index:20;min-width:205px;padding:5px;background:#fff;border:1px solid #dfe6ee;border-radius:8px;box-shadow:0 14px 34px rgba(12,35,66,.2)}.context-menu button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:5px;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#3b4f68;cursor:pointer}.context-menu button:hover{background:#eef4fb;color:#1b4d85}.context-menu button:disabled{color:#8d99a8;cursor:default}.context-menu button:disabled:hover{background:transparent;color:#8d99a8}.hierarchy-icon{width:18px;height:18px;object-fit:contain;flex:none}.child-node-action{border:1px solid #d8e4f1!important;border-radius:6px!important;background:#f4f8fd!important;color:#315f96!important;padding:6px 10px;font-weight:700}.tree-title{flex:1;border:0;background:transparent;color:#d4e0ef;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;cursor:pointer}.child{border:0;background:transparent;color:#9db3cf;opacity:0;cursor:pointer}.tree-row:hover .child{opacity:1}.bottom{margin-top:auto}.save-badge{border-block:1px solid #ffffff20;padding:14px 7px;display:flex;align-items:center;gap:9px;color:#e5edf7;font-size:10px}.dot{height:7px;width:7px;border-radius:50%;background:#64d2a0}.save-badge small{display:block;color:#91a8c6;font-size:9px;margin-top:4px}.account{display:flex;gap:9px;align-items:center;padding:13px 5px 0;font-size:10px}.avatar{height:30px;width:30px;background:#224c84;border-radius:50%;display:grid;place-items:center;font:18px Georgia,serif}.account small{color:#91a8c6;font-size:9px;margin-top:3px}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);padding:0 25px;display:flex;align-items:center;justify-content:space-between}.crumb{font-size:11px;color:#8895a6}.crumb b{color:#394a61;margin-left:9px}.search{height:34px;width:250px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fafbfd;border:1px solid #e5eaf0;border-radius:7px;color:#8795a8}.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font:11px inherit}.layout{min-height:0;flex:1;display:flex;gap:16px;padding:19px}.list{width:340px;flex:0 0 340px;background:white;border:1px solid #e9edf2;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.heading{padding:21px 21px 16px}.date{font-size:10px;color:var(--blue);font-weight:700;margin-bottom:8px}.heading h1{font:25px Georgia,serif;color:#142e50;margin:0}.heading p{font-size:10px;color:#8390a1;margin:7px 0 0}.listbar{height:43px;border-block:1px solid #edf0f4;display:flex;align-items:center;justify-content:space-between;padding:0 15px 0 21px}.listbar span{font-size:8px;letter-spacing:1px;color:#9aa5b3;font-weight:700}.listbar button{border:0;background:transparent;color:var(--blue);font-weight:700;font-size:10px;cursor:pointer}.items{flex:1;overflow:auto;padding:8px 10px}.item{width:100%;padding:12px;border:1px solid transparent;border-radius:8px;background:white;text-align:left;margin-bottom:3px;cursor:pointer}.item:hover{background:#f9fbfe}.item.sel{background:#f1f6fc;border-color:#dce8f6}.kind{font-size:9px;color:#718297;font-weight:600}.kind:before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:#85a8d5;margin-right:6px}.kind.journal:before{background:#7e9cc6}.kind.knowledge:before{background:#63a48f}.kind.pdf:before{background:#ce9568}.item strong{display:block;font-size:12px;color:#273950;margin-top:7px}.item p{font-size:10px;color:#8a97a7;line-height:1.5;margin:5px 0 9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.item time{font-size:9px;color:#9aa6b3}.footer{border-top:1px solid #f0f2f5;padding:10px 16px;display:flex;justify-content:space-between;color:#a2adba;font-size:9px}.editor{min-width:0;flex:1;background:white;border:1px solid #e9edf2;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.toolbar{height:50px;border-bottom:1px solid #edf0f4;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;gap:9px}.toolbar button{border:0;background:transparent;color:#78899d;font-size:10px;cursor:pointer}.status{margin-right:auto;color:#8291a4;font-size:9px}.status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#69ae8e;margin-right:6px}.doc{padding:27px 8%;overflow:auto;flex:1;display:flex;flex-direction:column}.meta{font-size:9px;color:#718297}.title{width:100%;border:0;outline:0;background:transparent;padding:15px 0 13px;color:#183253;font:32px Georgia,serif}.format{height:35px;border-block:1px solid #eff1f4;display:flex;align-items:center;gap:11px;color:#9aa5b1;font-size:9px}.body{width:100%;min-height:300px;flex:1;resize:none;border:0;outline:0;background:transparent;color:#4b5d72;font:13px/1.85 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin-top:17px}.bottomline{margin-top:auto;padding-top:14px;border-top:1px solid #f0f2f5;color:#9aa6b3;font-size:9px}.empty{margin:auto;text-align:center;padding:32px}.empty .spark{width:49px;height:49px;border-radius:16px;background:#eef4fb;color:#5078a9;display:grid;place-items:center;margin:0 auto 14px;font-size:22px}.empty h2{font:21px Georgia,serif;color:#1c3658;margin:0}.empty p{color:#8895a4;font-size:11px;margin:8px 0 16px}.cta{border:0;background:var(--navy);color:#fff;border-radius:7px;padding:10px 13px;font-size:10px;font-weight:700;cursor:pointer}.pdfbox{flex:1;display:flex;flex-direction:column}.pdfbox iframe{width:100%;height:400px;border:0;background:#f1f4f8;margin:10px 0}.pdfbox button{border:0;background:#edf4fc;color:#34659e;border-radius:5px;padding:8px;cursor:pointer}.tree-empty{padding:5px 10px;color:#89a0bf;font-size:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#183659;color:white;padding:10px 15px;border-radius:8px;font-size:11px;z-index:3}.mobile-new{display:none}@media(max-width:900px){.sidebar{width:205px}.layout{padding:12px;gap:10px}.list{width:300px;flex-basis:300px}.top{padding:0 17px}}@media(max-width:690px){.shell{min-height:100vh;height:100dvh}.sidebar{display:none}.top{height:54px;padding:0 12px}.layout{padding:8px}.list{width:100%;flex:1}.editor{display:none}.layout.editing .list{display:none}.layout.editing .editor{display:flex}.doc{padding:22px 6%}.title{font-size:27px}.mobile-new{display:block;border:0;background:var(--navy);color:white;border-radius:7px;padding:7px 9px}.search{width:min(50vw,240px)}}@media print{.sidebar,.top,.list,.toolbar,.format,.bottomline{display:none!important}.shell,.main,.layout,.editor{display:block!important;height:auto!important;overflow:visible!important;border:0;padding:0;margin:0}.doc{overflow:visible;padding:0}.title{font-size:25pt}.body{min-height:0;overflow:visible;white-space:pre-wrap}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="mark"><img src="/qvill-logo.png" alt="Qvill logo"></div><div><strong>Qvill</strong><small>your space to think</small></div></div>
    <button class="new" data-action="new-quick">＋ &nbsp; New note <span>⌘ N</span></button>
    <div class="label">WORKSPACE</div>
    <button class="nav active" data-section="inbox">▤ &nbsp; All notes <b id="count-inbox">0</b></button>
    <button class="nav" data-section="journal">▦ &nbsp; Daily journal <b id="count-journal">0</b></button>
    <button class="nav" data-section="knowledge">⌘ &nbsp; Knowledge base <b id="count-knowledge">0</b></button>
    <button class="nav" data-section="pdfs">▧ &nbsp; PDF library <b id="count-pdfs">0</b></button>
    <div class="treehead">YOUR PAGES <button data-action="new-page" title="New page">＋</button></div>
    <div class="tree" id="tree"></div>
    <div class="bottom"><div class="save-badge"><span class="dot"></span><div>Saved on this Mac<small id="save-message">Local app storage</small></div></div><div class="account"><div class="avatar">Q</div><div><strong>My workspace</strong><small>Personal space</small></div></div></div>
  </aside>
  <section class="main">
    <header class="top"><div class="crumb">Workspace <b id="crumb">All notes</b></div><div style="display:flex;gap:9px;align-items:center"><label class="search">⌕ <input id="search" placeholder="Search notes…" autocomplete="off"></label><button class="mobile-new" data-action="new-quick">＋</button></div></header>
    <div class="layout" id="layout">
      <section class="list"><div class="heading"><div class="date" id="date"></div><h1 id="section-title">A little space to think.</h1><p id="section-subtitle">Capture a thought, then let it find its place.</p></div><div class="listbar"><span id="list-label">RECENT NOTES</span><button id="list-add">＋ New note</button><input type="file" id="pdf-file" accept="application/pdf,.pdf" hidden></div><div class="items" id="items"></div><div class="footer"><span id="item-count"></span><span>Private on this Mac</span></div></section>
      <section class="editor" id="editor"></section>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<div class="context-menu" id="tree-context" hidden></div>
<script>
(() => {
  const DB_NAME="qvill-desktop", STORE="notes";
  let db, notes=[], activeId=null, section="inbox", query="", expanded={};
  const $=id=>document.getElementById(id);
  const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
  const now=()=>new Date().toISOString();
  const uuid=()=>crypto.randomUUID?.()??`${Date.now()}-${Math.random().toString(16).slice(2)}`;
  const active=()=>notes.find(n=>n.id===activeId)??null;
  const labelKind=k=>({quick:"Quick note",journal:"Daily journal",knowledge:"Knowledge page",pdf:"PDF document"}[k]||"Note");
  const levelNames=["Tree","Branches","Leaf","Flower","Fruit"];
  function nodeDepth(id){const seen=new Set();let node=notes.find(n=>n.id===id),depth=0;while(node?.parentId){if(seen.has(node.id))return levelNames.length;seen.add(node.id);const parent=notes.find(n=>n.id===node.parentId&&n.kind==="knowledge");if(!parent)break;depth++;node=parent}return depth}
  const levelName=node=>levelNames[Math.min(nodeDepth(node.id),levelNames.length-1)];
  const canAddChild=id=>{const parent=notes.find(n=>n.id===id&&n.kind==="knowledge");return !!parent&&nodeDepth(id)<levelNames.length-1};
  const excerpt=s=>String(s||"").replace(/[#>*_`\[\]]/g," ").replace(/\s+/g," ").trim();
  const dateAgo=value=>{const t=Date.now()-new Date(value).getTime();if(t<60000)return"Just now";if(t<3600000)return`${Math.floor(t/60000)}m ago`;if(t<86400000)return`${Math.floor(t/3600000)}h ago`;return new Intl.DateTimeFormat("en",{month:"short",day:"numeric"}).format(new Date(value))};
  const openDB=()=>new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id"});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
  const allNotes=()=>new Promise((resolve,reject)=>{const r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
  const put=note=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(note);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
  const del=id=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
  function showToast(text){const t=$("toast");t.textContent=text;t.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.hidden=true,2800)}
  function make(kind,parentId=null){const date=now();return{id:uuid(),kind,title:kind==="journal"?"Daily note":kind==="knowledge"?"New page":kind==="pdf"?"Imported PDF":"Untitled note",body:"",parentId,tags:[],pinned:false,archived:false,createdAt:date,updatedAt:date,...(kind==="journal"?{entryDate:today()}:{})}}
  async function create(kind,parentId=null){if(kind==="knowledge"&&parentId&&!canAddChild(parentId)){showToast("Fruit pages are the last level and cannot have child pages.");return}if(kind==="journal"){const found=notes.find(n=>n.kind==="journal"&&n.entryDate===today());if(found){activeId=found.id;section="journal";render();return}}const note=make(kind,parentId);if(kind==="knowledge")note.title=`${parentId?levelNames[Math.min(nodeDepth(parentId)+1,levelNames.length-1)]:levelNames[0]} page`;notes.unshift(note);activeId=note.id;section=kind==="journal"?"journal":kind==="knowledge"?"knowledge":kind==="pdf"?"pdfs":"inbox";if(parentId)expanded[parentId]=true;await put(note);render();setTimeout(()=>$("title-input")?.focus(),40)}
  async function saveActive(changes){const n=active();if(!n)return;Object.assign(n,changes,{updatedAt:now()});notes.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));$("save-status").textContent="Saving…";try{await put(n);$("save-status").textContent="Saved";$("save-message").textContent="Local app storage";updateListOnly()}catch{$("save-status").textContent="Save failed";showToast("Could not save. Check available storage.")}}
  function childrenMap(){const knowledge=notes.filter(n=>n.kind==="knowledge"&&!n.archived),valid=new Set(knowledge.map(n=>n.id)),map=new Map();for(const n of knowledge){const p=valid.has(n.parentId)?n.parentId:null;map.set(p,[...(map.get(p)||[]),n])}for(const a of map.values())a.sort((x,y)=>x.title.localeCompare(y.title));return map}
  function treeHTML(map,parent=null,depth=0){return(map.get(parent)||[]).map(n=>`<div><div class="tree-row ${activeId===n.id?"sel":""}" data-id="${n.id}" data-depth="${depth}" style="padding-left:${8+depth*14}px"><button class="tree-toggle" data-action="toggle" data-id="${n.id}">${depth<levelNames.length-1&&map.has(n.id)?(expanded[n.id]?"⌄":"›"):""}</button><img class="hierarchy-icon" src="/hierarchy/${levelNames[Math.min(depth,levelNames.length-1)].toLowerCase()}.png" alt=""><button class="tree-title" data-action="open" data-id="${n.id}">${esc(n.title||"Untitled page")}</button><span class="tree-level">${levelNames[Math.min(depth,levelNames.length-1)]}</span>${depth<levelNames.length-1?`<button class="child" data-action="child" data-id="${n.id}" title="Add ${levelNames[depth+1]} page">＋</button>`:""}</div>${expanded[n.id]&&depth<levelNames.length-1?treeHTML(map,n.id,depth+1):""}</div>`).join("")}
  function filtered(){const q=query.trim().toLowerCase();return notes.filter(n=>!n.archived&&(section==="inbox"?["quick","knowledge"].includes(n.kind):section==="journal"?n.kind==="journal":section==="knowledge"?n.kind==="knowledge":n.kind==="pdf")&&(!q||`${n.title} ${n.body} ${(n.tags||[]).join(" ")}`.toLowerCase().includes(q)))}
  function renderList(){const list=filtered();$("items").innerHTML=list.length?list.map(n=>`<button class="item ${n.id===activeId?"sel":""}" data-action="open" data-id="${n.id}"><span class="kind ${n.kind}">${n.kind==="knowledge"?`<img class="hierarchy-icon" src="/hierarchy/${levelName(n).toLowerCase()}.png" alt="">${levelName(n)} page`:labelKind(n.kind)}</span><strong>${n.pinned?"⌑ ":""}${esc(n.title||"Untitled note")}</strong><p>${esc(n.kind==="pdf"?n.attachmentName||"PDF attachment":excerpt(n.body)||"No text yet — open this note to add your thoughts.")}</p><time>${dateAgo(n.updatedAt)}</time></button>`).join(""):`<div class="empty"><div class="spark">✳</div><h2>${query?"No notes found":section==="journal"?"Your journal starts here":section==="knowledge"?"Make your first page":section==="pdfs"?"No PDFs yet":"Start with a small thought"}</h2><p>${section==="pdfs"?"Import a PDF to keep it with your notes.":"Everything you write is saved on this Mac as you go."}</p>${!query?`<button class="cta" data-action="empty-create">＋ ${section==="journal"?"Write today’s entry":section==="knowledge"?"Create a Tree page":section==="pdfs"?"Import a PDF":"Create your first note"}</button>`:""}</div>`;$("item-count").textContent=list.length?`${list.length} ${list.length===1?"item":"items"}`:"";for(const k of ["inbox","journal","knowledge","pdfs"]){const count=notes.filter(n=>!n.archived&&(k==="inbox"?["quick","knowledge"].includes(n.kind):k==="pdfs"?n.kind==="pdf":n.kind===k)).length;$("count-"+k).textContent=count}}
  function updateListOnly(){renderList();if(activeId){const title=$("title-input");if(title)title.value=active()?.title||""}}
  function renderEditor(){const n=active(),e=$("editor");$("layout").classList.toggle("editing",!!n);if(!n){e.innerHTML=`<div class="empty"><div class="spark">✳</div><h2>Your thoughts have room here.</h2><p>Select a note to continue, or start with a fresh page.</p><button class="cta" data-action="new-quick">＋ Create a new note</button></div>`;return}const parent=n.parentId?notes.find(x=>x.id===n.parentId)?.title:"";e.innerHTML=`<div class="toolbar"><span class="status" id="save-status">Saved</span>${n.kind==="knowledge"&&canAddChild(n.id)?`<button class="child-node-action" data-action="child" data-id="${n.id}">+ child node</button>`:""}<button data-action="pin">${n.pinned?"Unpin":"Pin"}</button><button data-action="share">Share</button><button data-action="markdown">Export .md</button><button data-action="print">Print / PDF</button><button data-action="delete">Delete</button></div><article class="doc"><div class="meta"><span class="kind ${n.kind}">${n.kind==="knowledge"?`<img class="hierarchy-icon" src="/hierarchy/${levelName(n).toLowerCase()}.png" alt="">${levelName(n)} page`:labelKind(n.kind)}</span>${n.entryDate?` &nbsp; · &nbsp; ${esc(n.entryDate)}`:""}${parent?` &nbsp; · &nbsp; in ${esc(parent)}`:""}</div><input id="title-input" class="title" placeholder="Untitled note" value="${esc(n.title)}"><div class="format">T &nbsp; │ &nbsp; Write freely, or use Markdown for headings and lists.</div>${n.kind==="pdf"?`<div class="pdfbox"><p>${esc(n.attachmentName||"Imported PDF")}</p><iframe id="pdf-frame" title="Imported PDF"></iframe><button data-action="convert">Convert to editable note</button><p>Text extraction and annotations are planned for the document workflow.</p></div>`:`<textarea id="body-input" class="body" placeholder="${n.kind==="journal"?"What’s on your mind today?\n\nStart anywhere…":"Write something worth remembering…"}">${esc(n.body)}</textarea>`}<div class="bottomline">Created ${new Intl.DateTimeFormat("en",{month:"long",day:"numeric",year:"numeric"}).format(new Date(n.createdAt))}</div></article>`;if(n.kind==="pdf"&&n.attachmentData){const url=URL.createObjectURL(n.attachmentData);const frame=$("pdf-frame");frame.src=url;frame.dataset.url=url}}
  function render(){const titles={inbox:["All notes","A little space to think.","Capture a thought, then let it find its place.","RECENT NOTES"],journal:["Daily journal","Your daily journal","One day at a time. Your thoughts, in your words.","RECENT ENTRIES"],knowledge:["Knowledge base","Knowledge base","Tree → Branches → Leaf → Flower → Fruit. Fruit is the last level.","PAGES"],pdfs:["PDF library","Your PDFs","Your documents, notes, and ideas together.","DOCUMENTS"]}[section];$("crumb").textContent=titles[0];$("section-title").textContent=titles[1];$("section-subtitle").textContent=titles[2];$("list-label").textContent=titles[3];$("list-add").textContent=section==="journal"?"＋ Today’s entry":section==="knowledge"?"+ child node":section==="pdfs"?"＋ Import PDF":"＋ New note";$("list-add").onclick=()=>section==="journal"?create("journal"):section==="knowledge"?create("knowledge",active()?.kind==="knowledge"?active().id:null):section==="pdfs"?$("pdf-file").click():create("quick");$("list-add").hidden=section==="knowledge"&&active()?.kind==="knowledge"&&!canAddChild(active().id);document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.section===section));const map=childrenMap();$("tree").innerHTML=map.has(null)?treeHTML(map):`<div class="tree-empty">Your pages will appear here</div>`;renderList();renderEditor()}
  document.addEventListener("click",async e=>{$("tree-context").hidden=true;const b=e.target.closest("[data-action]");if(!b)return;const id=b.dataset.id;switch(b.dataset.action){case"new-quick":await create("quick");break;case"new-page":await create("knowledge");break;case"open":activeId=id;render();break;case"toggle":expanded[id]=!expanded[id];render();break;case"child":await create("knowledge",id);break;case"empty-create":section==="journal"?await create("journal"):section==="knowledge"?await create("knowledge"):section==="pdfs"?$("pdf-file").click():await create("quick");break;case"pin":await saveActive({pinned:!active().pinned});renderEditor();break;case"delete":{const n=active();if(n){await del(n.id);notes=notes.filter(x=>x.id!==n.id);activeId=null;render();showToast("Note deleted")};break}case"markdown":{const n=active();if(!n)break;const blob=new Blob([`# ${n.title}\n\n${n.body}\n`],{type:"text/markdown"});download(blob,`${n.title||"qvill-note"}.md`);break}case"print":if(window.webkit?.messageHandlers?.qvill)window.webkit.messageHandlers.qvill.postMessage({action:"print"});else window.print();break;case"share":{const n=active();if(!n)break;const text=`${n.title}\n\n${n.body||""}`;if(n.kind==="pdf"&&n.attachmentData){const file=new File([n.attachmentData],n.attachmentName||"qvill-document.pdf",{type:"application/pdf"});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:n.title})}catch{}}else{download(file,n.attachmentName||"qvill-document.pdf");showToast("PDF downloaded; share it from Finder")}}else if(navigator.share){try{await navigator.share({title:n.title,text})}catch{}}else{await navigator.clipboard?.writeText(text);showToast("Note copied to clipboard")};break}case"convert":showToast("PDF text extraction is coming in a later build");break}});
  $("tree").addEventListener("contextmenu",e=>{const row=e.target.closest(".tree-row");if(!row)return;e.preventDefault();const id=row.dataset.id,depth=Number(row.dataset.depth),menu=$("tree-context");menu.innerHTML=depth<levelNames.length-1?`<button data-action="child" data-id="${id}">＋ Add ${levelNames[depth+1]} page</button>`:`<button disabled>Fruit is the last level; it cannot have child pages</button>`;menu.style.left=`${Math.min(e.clientX,window.innerWidth-220)}px`;menu.style.top=`${Math.min(e.clientY,window.innerHeight-55)}px`;menu.hidden=false});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")$("tree-context").hidden=true});
  document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>{section=b.dataset.section;activeId=null;query="";$("search").value="";render()}));
  $("search").addEventListener("input",e=>{query=e.target.value;renderList()});
  $("title-input")?.addEventListener("input",e=>saveActive({title:e.target.value}));
  document.addEventListener("input",e=>{if(e.target.id==="title-input")saveActive({title:e.target.value});if(e.target.id==="body-input")saveActive({body:e.target.value})});
  $("pdf-file").addEventListener("change",async e=>{const file=e.target.files?.[0];e.target.value="";if(!file)return;if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){showToast("Choose a PDF file to import");return}const n=make("pdf");n.title=file.name.replace(/\.pdf$/i,"")||"Imported PDF";n.attachmentName=file.name;n.attachmentData=file;notes.unshift(n);activeId=n.id;section="pdfs";await put(n);render()});
  function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name.replace(/[\\/:*?"<>|]/g,"-");a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
  $("date").textContent=new Intl.DateTimeFormat("en",{weekday:"long",month:"long",day:"numeric"}).format(new Date());
  window.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="n"){e.preventDefault();create("quick")}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("search").focus()}});
  openDB().then(async value=>{db=value;notes=await allNotes();notes.sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));render()}).catch(()=>showToast("Could not open local storage"));
})();
</script>
